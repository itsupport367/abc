<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKC Visitor Entry Form</title>

<style>
body{
	display:flex;
	height:100vh;
	justify-content:center;
	align-items:center;
	//background:url('adming.gif')no-repeat;
	background:url('mkc.gif')no-repeat;
	background-size:cover;
	background-size: 100% 100%;
	backdrop-filter: blur(5px);
	opacity: 0.9;
}
*{
	padding:0;
	margin:0;
	box-sizing:border-box;
	font-family:sans-serif;
}
.container {
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 2px 12px #ccc;
}
h2 { text-align: center; color: #173b68; }
input, select, textarea, button {
  width: 100%;
  padding: 12px;
  margin: 9px 0;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
}
button {
  background: #1769aa;
  color: white;
  border: none;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

<h2>Visitor Entry Form</h2>

<form id="visitorForm">

<label>Visitor Name</label>
<input type="text" name="name"
placeholder="Enter your name" required>

<label>Mobile Number</label>
<input type="tel" name="mobile"
placeholder="Enter mobile number"
pattern="[0-9]{10}" required>

<label>Company Name</label>
<input type="text" name="company"
placeholder="Enter company name" required>

<label>Person to Meet</label>
<input type="text" name="person"
placeholder="Whom do you want to meet?" required>

<label>Visit Purpose</label>
<select name="purpose" required>
<option value="">Select purpose</option>
<option>Meeting</option>
<option>Official Work</option>
<option>Delivery</option>
<option>Interview</option>
<option>Other</option>
</select>

<label>Visitor Selfie</label>
<input type="file" name="selfie"
accept="image/*" capture="user" required>

<label>Additional Details</label>
<textarea name="details"
placeholder="Enter details"></textarea>

<button type="submit">Submit Visitor Details</button>

</form>

<p id="message"></p>

</div>

<script>
document.getElementById("visitorForm")
.addEventListener("submit", function(e) {
  e.preventDefault();
  document.getElementById("message").textContent =
    "Form completed. Connect a database to save visitor details.";
});
</script>

</body>
</html>
